<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Waris (Faraid) Mazhab Syafi'i</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-emerald-700 text-white p-6 text-center">
            <h1 class="text-2xl font-bold mb-2">Kalkulator Waris Faraid</h1>
            <p class="text-emerald-100 text-sm">Berdasarkan Mazhab Syafi'i (Lengkap 10 Laki-laki & 7 Perempuan)</p>
        </div>

        <div class="p-6 md:p-8 flex flex-col md:flex-row gap-8">
            <!-- Form Input -->
            <div class="w-full md:w-1/2 space-y-6">
                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4 text-emerald-800">1. Data Pewaris</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">Total Harta Warisan (Rp)</label>
                            <input type="number" id="totalHarta" class="w-full p-2 border border-slate-300 rounded focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Contoh: 100000000" value="100000000">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Jenis Kelamin Almarhum/ah</label>
                            <select id="gender" class="w-full p-2 border border-slate-300 rounded outline-none">
                                <option value="l">Laki-laki (Meninggalkan Istri)</option>
                                <option value="p">Perempuan (Meninggalkan Suami)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4 text-emerald-800">2. Ahli Waris (Masukkan Jumlah)</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Pasangan -->
                        <div>
                            <label id="labelPasangan" class="block text-sm font-semibold mb-1">Istri</label>
                            <input type="number" id="pasangan" min="0" max="4" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div></div> <!-- Spacer -->

                        <!-- Ushul (Ke atas) -->
                        <div>
                            <label class="block text-sm font-semibold mb-1">Ayah</label>
                            <input type="number" id="ayah" min="0" max="1" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Ibu</label>
                            <input type="number" id="ibu" min="0" max="1" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Kakek (Sahih)</label>
                            <input type="number" id="kakek" min="0" max="1" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Nenek (Sahihah)</label>
                            <input type="number" id="nenek" min="0" max="2" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>

                        <!-- Furu' (Ke bawah) -->
                        <div>
                            <label class="block text-sm font-semibold mb-1">Anak Laki-laki</label>
                            <input type="number" id="anakLk" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Anak Perempuan</label>
                            <input type="number" id="anakPr" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Cucu Lk (dr Anak Lk)</label>
                            <input type="number" id="cucuLk" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Cucu Pr (dr Anak Lk)</label>
                            <input type="number" id="cucuPr" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>

                        <!-- Hawasyi (Menyamping) -->
                        <div>
                            <label class="block text-sm font-semibold mb-1">Sdr Lk Sekandung</label>
                            <input type="number" id="sdrLk" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Sdr Pr Sekandung</label>
                            <input type="number" id="sdrPr" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Sdr Lk Sebapak</label>
                            <input type="number" id="sdrLkBapak" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Sdr Pr Sebapak</label>
                            <input type="number" id="sdrPrBapak" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1 text-emerald-700">Sdr Seibu (Lk/Pr)</label>
                            <input type="number" id="sdrIbu" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div></div>

                        <!-- Asabah Lainnya (Keponakan, Paman, Pembebas Budak) -->
                        <div class="col-span-2 mt-2">
                            <h3 class="text-sm font-bold text-emerald-700 border-b pb-1 mb-2">Kerabat Lain (Asabah) & Pembebas Budak</h3>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Keponakan Lk (Anak Sdr Lk)</label>
                            <input type="number" id="keponakanLk" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Paman (Pihak Bapak)</label>
                            <input type="number" id="paman" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Sepupu Lk (Anak Paman)</label>
                            <input type="number" id="anakPaman" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Pembebas Budak (Mu'tiq)</label>
                            <input type="number" id="mutiq" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                    </div>
                </div>

                <button onclick="hitungFaraid()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    Hitung Warisan
                </button>
            </div>

            <!-- Hasil Output -->
            <div class="w-full md:w-1/2 bg-slate-50 p-6 rounded-xl border border-slate-200 h-fit">
                <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Hasil Perhitungan</h2>
                <div id="statusKondisi" class="text-sm font-medium px-3 py-2 bg-blue-100 text-blue-800 rounded-md mb-4 hidden">
                    <!-- Status Aul/Rad muncul disini -->
                </div>
                <div id="hasilDiv" class="space-y-3">
                    <p class="text-slate-500 italic text-sm">Silakan masukkan data ahli waris dan klik hitung.</p>
                </div>
                
                <div class="mt-8 pt-4 border-t border-slate-200">
                    <h3 class="font-bold text-slate-700 text-sm mb-2">Penyelesaian Matematika (Asal Masalah):</h3>
                    <div id="asalMasalahDiv" class="font-mono text-sm bg-white p-3 border rounded">
                        -
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mengubah label Istri/Suami dinamis berdasarkan jenis kelamin
        document.getElementById('gender').addEventListener('change', function() {
            const label = document.getElementById('labelPasangan');
            const input = document.getElementById('pasangan');
            if (this.value === 'l') {
                label.innerText = 'Istri';
                input.max = 4;
            } else {
                label.innerText = 'Suami';
                input.max = 1;
                if(input.value > 1) input.value = 1;
            }
        });

        // Utilities Matematika Pecahan (KPK dan FPB)
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        function lcm(a, b) { return (a * b) / gcd(a, b); }
        function arrayLcm(arr) {
            if(arr.length === 0) return 1;
            let result = arr[0];
            for (let i = 1; i < arr.length; i++) result = lcm(result, arr[i]);
            return result;
        }

        // Fungsi Utama
        function hitungFaraid() {
            const totalHarta = parseFloat(document.getElementById('totalHarta').value) || 0;
            const gender = document.getElementById('gender').value;
            
            // Ahli Waris Object (Telah dilengkapi dengan Asabah Ekstra)
            const aw = {
                pasangan: parseInt(document.getElementById('pasangan').value) || 0,
                ayah: parseInt(document.getElementById('ayah').value) || 0,
                ibu: parseInt(document.getElementById('ibu').value) || 0,
                kakek: parseInt(document.getElementById('kakek').value) || 0,
                nenek: parseInt(document.getElementById('nenek').value) || 0,
                anakLk: parseInt(document.getElementById('anakLk').value) || 0,
                anakPr: parseInt(document.getElementById('anakPr').value) || 0,
                cucuLk: parseInt(document.getElementById('cucuLk').value) || 0,
                cucuPr: parseInt(document.getElementById('cucuPr').value) || 0,
                sdrLk: parseInt(document.getElementById('sdrLk').value) || 0,
                sdrPr: parseInt(document.getElementById('sdrPr').value) || 0,
                sdrLkBapak: parseInt(document.getElementById('sdrLkBapak').value) || 0,
                sdrPrBapak: parseInt(document.getElementById('sdrPrBapak').value) || 0,
                sdrIbu: parseInt(document.getElementById('sdrIbu').value) || 0,
                keponakanLk: parseInt(document.getElementById('keponakanLk').value) || 0,
                paman: parseInt(document.getElementById('paman').value) || 0,
                anakPaman: parseInt(document.getElementById('anakPaman').value) || 0,
                mutiq: parseInt(document.getElementById('mutiq').value) || 0
            };

            const hasFuru = aw.anakLk > 0 || aw.anakPr > 0 || aw.cucuLk > 0 || aw.cucuPr > 0;
            const hasFuruLk = aw.anakLk > 0 || aw.cucuLk > 0;
            const totalSdr = aw.sdrLk + aw.sdrPr + aw.sdrLkBapak + aw.sdrPrBapak + aw.sdrIbu;
            const hasSdrBanyak = totalSdr > 1;

            let saham = {}; 

            // 1. SISTEM HUJUB (PENGHALANG) YANG DIPERBAIKI & DILENGKAPI
            
            // Ayah menghalangi kakek, nenek (pihak ayah), & semua saudara + asabah kerabat jauh
            if (aw.ayah > 0) { 
                aw.kakek = 0; aw.sdrLk = 0; aw.sdrPr = 0; aw.sdrLkBapak = 0; aw.sdrPrBapak = 0; aw.sdrIbu = 0; 
                aw.keponakanLk = 0; aw.paman = 0; aw.anakPaman = 0;
            }
            if (aw.ibu > 0) aw.nenek = 0; 
            
            // Furu' Laki-laki (Anak/Cucu Lk) menghalangi semua saudara + asabah kerabat jauh
            if (hasFuruLk) { 
                aw.sdrLk = 0; aw.sdrPr = 0; aw.sdrLkBapak = 0; aw.sdrPrBapak = 0; aw.sdrIbu = 0; 
                aw.keponakanLk = 0; aw.paman = 0; aw.anakPaman = 0;
            }
            
            // Furu' Pr dan Kakek menghalangi saudara seibu
            if (aw.anakPr > 0 || aw.cucuPr > 0 || aw.kakek > 0) { aw.sdrIbu = 0; }
            
            // Anak Lk menghalangi cucu
            if (aw.anakLk > 0) { aw.cucuLk = 0; aw.cucuPr = 0; }
            // 2 Anak Pr menghalangi cucu Pr (Kecuali ada cucu Lk)
            if (aw.anakPr >= 2 && aw.cucuLk === 0) { aw.cucuPr = 0; }

            // Kakek menghalangi Keponakan, Paman, dan Sepupu
            if (aw.kakek > 0) { aw.keponakanLk = 0; aw.paman = 0; aw.anakPaman = 0; }

            // Sdr Lk sekandung menghalangi saudara sebapak + kerabat jauh
            if (aw.sdrLk > 0) { 
                aw.sdrLkBapak = 0; aw.sdrPrBapak = 0; 
                aw.keponakanLk = 0; aw.paman = 0; aw.anakPaman = 0; 
            }
            
            // Asabah Ma'al Ghair (Sdr Pr Sekandung bersama Anak/Cucu Pr)
            let sdrPrKandungAsabahGhair = (aw.sdrPr > 0 && aw.sdrLk === 0 && (aw.anakPr > 0 || aw.cucuPr > 0));
            if (sdrPrKandungAsabahGhair) { 
                aw.sdrLkBapak = 0; aw.sdrPrBapak = 0; 
                aw.keponakanLk = 0; aw.paman = 0; aw.anakPaman = 0; 
            }
            
            // 2 Sdr Pr sekandung menghalangi Sdr Pr sebapak (Kecuali ada Sdr Lk Sebapak)
            if (aw.sdrPr >= 2 && aw.sdrLkBapak === 0) { aw.sdrPrBapak = 0; }

            let sdrPrBapakAsabahGhair = (aw.sdrPrBapak > 0 && aw.sdrLkBapak === 0 && (aw.anakPr > 0 || aw.cucuPr > 0));
            if (aw.sdrLkBapak > 0 || sdrPrBapakAsabahGhair) { 
                aw.keponakanLk = 0; aw.paman = 0; aw.anakPaman = 0; 
            }

            // Hujub berjenjang untuk Asabah jauh
            if (aw.keponakanLk > 0) { aw.paman = 0; aw.anakPaman = 0; }
            if (aw.paman > 0) { aw.anakPaman = 0; }

            // 2. TENTUKAN FURUDH (BAGIAN PASTI)
            let isGharawain = (!hasFuru && !hasSdrBanyak && aw.ayah > 0 && aw.ibu > 0 && aw.pasangan > 0);

            if (aw.pasangan > 0) {
                if (gender === 'p') saham['Suami'] = { n: 1, d: hasFuru ? 4 : 2, isAsabah: false, count: aw.pasangan };
                else saham['Istri'] = { n: 1, d: hasFuru ? 8 : 4, isAsabah: false, count: aw.pasangan };
            }

            if (aw.ibu > 0) {
                if (isGharawain) { 
                    saham['Ibu (Gharawain)'] = { n: 1, d: (gender === 'p') ? 6 : 4, isAsabah: false, count: 1 };
                } else {
                    saham['Ibu'] = { n: 1, d: (hasFuru || hasSdrBanyak) ? 6 : 3, isAsabah: false, count: 1 };
                }
            }

            if (aw.nenek > 0 && aw.ibu === 0) {
                saham['Nenek'] = { n: 1, d: 6, isAsabah: false, count: aw.nenek };
            }

            if (aw.anakPr > 0 && aw.anakLk === 0) {
                saham['Anak Perempuan'] = { n: aw.anakPr === 1 ? 1 : 2, d: aw.anakPr === 1 ? 2 : 3, isAsabah: false, count: aw.anakPr };
            }
            
            if (aw.cucuPr > 0 && aw.cucuLk === 0) {
                if (aw.anakPr === 0) saham['Cucu Perempuan'] = { n: aw.cucuPr === 1 ? 1 : 2, d: aw.cucuPr === 1 ? 2 : 3, isAsabah: false, count: aw.cucuPr };
                else if (aw.anakPr === 1) saham['Cucu Perempuan (Takmilah)'] = { n: 1, d: 6, isAsabah: false, count: aw.cucuPr };
            }

            if (aw.sdrPr > 0 && aw.sdrLk === 0 && !sdrPrKandungAsabahGhair && aw.kakek === 0) {
                saham['Sdr Pr Sekandung'] = { n: aw.sdrPr === 1 ? 1 : 2, d: aw.sdrPr === 1 ? 2 : 3, isAsabah: false, count: aw.sdrPr };
            }
            
            if (aw.sdrPrBapak > 0 && aw.sdrLkBapak === 0 && !sdrPrBapakAsabahGhair && aw.kakek === 0) {
                if (aw.sdrPr === 0) saham['Sdr Pr Sebapak'] = { n: aw.sdrPrBapak === 1 ? 1 : 2, d: aw.sdrPrBapak === 1 ? 2 : 3, isAsabah: false, count: aw.sdrPrBapak };
                else if (aw.sdrPr === 1) saham['Sdr Pr Sebapak (Takmilah)'] = { n: 1, d: 6, isAsabah: false, count: aw.sdrPrBapak };
            }

            if (aw.sdrIbu > 0) {
                saham['Saudara Seibu'] = { n: aw.sdrIbu === 1 ? 1 : 1, d: aw.sdrIbu === 1 ? 6 : 3, isAsabah: false, count: aw.sdrIbu };
            }

            let ayahAsabah = false;
            let kakekAsabah = false;
            
            if (aw.ayah > 0) {
                if (hasFuruLk) saham['Ayah'] = { n: 1, d: 6, isAsabah: false, count: 1 };
                else if (hasFuru) { saham['Ayah'] = { n: 1, d: 6, isAsabah: true, count: 1 }; ayahAsabah = true; }
                else ayahAsabah = true;
            }

            if (aw.kakek > 0) {
                if (hasFuruLk) saham['Kakek'] = { n: 1, d: 6, isAsabah: false, count: 1 };
                else if (hasFuru) { saham['Kakek'] = { n: 1, d: 6, isAsabah: true, count: 1 }; kakekAsabah = true; }
                else if (aw.sdrLk > 0 || aw.sdrPr > 0 || aw.sdrLkBapak > 0 || aw.sdrPrBapak > 0) {
                    saham['Kakek (Jadd wa Ikhwah)'] = { n: 1, d: 3, isAsabah: false, count: 1 }; 
                }
                else kakekAsabah = true;
            }

            // 3. TENTUKAN ASABAH (SISA) BERJENJANG
            let asabahPihak = null; 
            
            if (aw.anakLk > 0) {
                asabahPihak = 'Anak'; 
                saham['Asabah (Anak Lk & Pr)'] = { isAsabah: true, lk: aw.anakLk, pr: aw.anakPr };
            } else if (aw.cucuLk > 0) {
                asabahPihak = 'Cucu'; 
                saham['Asabah (Cucu Lk & Pr)'] = { isAsabah: true, lk: aw.cucuLk, pr: aw.cucuPr };
            } else if (ayahAsabah) {
                asabahPihak = 'Ayah';
                if(!saham['Ayah']) saham['Ayah (Asabah)'] = { isAsabah: true, count: 1 };
            } else if (kakekAsabah) {
                asabahPihak = 'Kakek';
                if(!saham['Kakek']) saham['Kakek (Asabah)'] = { isAsabah: true, count: 1 };
            } else if (aw.sdrLk > 0 || sdrPrKandungAsabahGhair) {
                asabahPihak = 'Saudara Sekandung';
                saham['Asabah (Sdr Sekandung)'] = { isAsabah: true, lk: aw.sdrLk, pr: aw.sdrPr };
            } else if (aw.sdrLkBapak > 0 || sdrPrBapakAsabahGhair) {
                asabahPihak = 'Saudara Sebapak';
                saham['Asabah (Sdr Sebapak)'] = { isAsabah: true, lk: aw.sdrLkBapak, pr: aw.sdrPrBapak };
            } else if (aw.keponakanLk > 0) {
                asabahPihak = 'Keponakan Lk';
                saham['Asabah (Keponakan Lk)'] = { isAsabah: true, lk: aw.keponakanLk, pr: 0 };
            } else if (aw.paman > 0) {
                asabahPihak = 'Paman';
                saham['Asabah (Paman)'] = { isAsabah: true, lk: aw.paman, pr: 0 };
            } else if (aw.anakPaman > 0) {
                asabahPihak = 'Anak Paman';
                saham['Asabah (Sepupu Lk/Anak Paman)'] = { isAsabah: true, lk: aw.anakPaman, pr: 0 };
            } else if (aw.mutiq > 0) {
                asabahPihak = 'Pembebas Budak';
                saham['Asabah (Pembebas Budak)'] = { isAsabah: true, lk: aw.mutiq, pr: 0 };
            }

            // 4. MENGHITUNG ASAL MASALAH
            let penyebutList = [];
            for (let key in saham) {
                if (saham[key].d) penyebutList.push(saham[key].d);
            }
            let asalMasalah = arrayLcm(penyebutList);
            if (asalMasalah === 1 && asabahPihak) asalMasalah = 1;

            let totalPembilang = 0;
            let furudhData = {};
            for (let key in saham) {
                if (saham[key].d) {
                    let nilaiPembilang = (asalMasalah / saham[key].d) * saham[key].n;
                    furudhData[key] = nilaiPembilang;
                    totalPembilang += nilaiPembilang;
                }
            }

            let statusText = "Normal";
            let sisaSaham = asalMasalah - totalPembilang;

            // 5. LOGIKA 'AUL & RAD
            if (totalPembilang > asalMasalah) {
                statusText = `Terdapat 'Aul: Asal Masalah naik dari ${asalMasalah} menjadi ${totalPembilang}`;
                asalMasalah = totalPembilang;
                sisaSaham = 0;
            } else if (totalPembilang < asalMasalah && !asabahPihak) {
                let pembilangTanpaPasangan = 0;
                for(let key in furudhData) {
                    if(key !== 'Suami' && key !== 'Istri') pembilangTanpaPasangan += furudhData[key];
                }
                
                if (pembilangTanpaPasangan > 0) {
                    statusText = `Terdapat Rad: Sisa harta dikembalikan proporsional ke ahli waris`;
                    asalMasalah = totalPembilang; 
                } else {
                    statusText = `Terdapat Rad: Seluruh sisa diserahkan ke Pasangan (ketiadaan ahli waris lain)`;
                    asalMasalah = totalPembilang;
                }
            }

            // 6. DISTRIBUSI KE ASABAH
            if (asabahPihak && sisaSaham > 0) {
                let found = false;
                for (let key in saham) {
                    if (saham[key].isAsabah && key.includes('Asabah')) {
                        furudhData[key] = sisaSaham;
                        found = true;
                    }
                }
                if(!found && saham['Ayah']) furudhData['Ayah'] = (furudhData['Ayah'] || 0) + sisaSaham;
                if(!found && saham['Kakek']) furudhData['Kakek'] = (furudhData['Kakek'] || 0) + sisaSaham;
            }

            // 7. RENDER HASIL
            let hasilHTML = "";
            let statusEl = document.getElementById('statusKondisi');
            
            if (statusText !== "Normal") {
                statusEl.innerText = statusText;
                statusEl.classList.remove('hidden', 'bg-blue-100', 'text-blue-800');
                if(statusText.includes('Aul')) statusEl.classList.add('bg-red-100', 'text-red-800');
                else statusEl.classList.add('bg-amber-100', 'text-amber-800');
            } else {
                statusEl.classList.add('hidden');
            }

            let nilaiPerSaham = totalHarta / asalMasalah;
            
            for (let key in furudhData) {
                let porsi = furudhData[key];
                if (porsi <= 0) continue;

                let namaDisplay = key;
                let detilUang = "";

                if (saham[key]?.isAsabah && (key.includes('Anak') || key.includes('Cucu') || key.includes('Sdr') || key.includes('Keponakan') || key.includes('Paman') || key.includes('Pembebas'))) {
                    let d = saham[key];
                    // Asabah pria = 2 bagian, wanita = 1 bagian (kecuali asabah pria yang sendirian)
                    let totalKepala = (d.pr !== undefined) ? (d.lk * 2) + d.pr : d.lk; 
                    let uangPerKepala = (porsi * nilaiPerSaham) / totalKepala;
                    
                    if (d.pr !== undefined) {
                        if (d.lk > 0) detilUang += `<div>Pria (${d.lk} org): <b>Rp ${(uangPerKepala * 2 * d.lk).toLocaleString('id-ID')}</b> (Rp ${(uangPerKepala * 2).toLocaleString('id-ID')}/org)</div>`;
                        if (d.pr > 0) detilUang += `<div>Wanita (${d.pr} org): <b>Rp ${(uangPerKepala * d.pr).toLocaleString('id-ID')}</b> (Rp ${uangPerKepala.toLocaleString('id-ID')}/org)</div>`;
                    } else {
                        detilUang += `<div>${d.lk} Orang: <b>Rp ${(porsi * nilaiPerSaham).toLocaleString('id-ID')}</b> (Rp ${(porsi * nilaiPerSaham / d.lk).toLocaleString('id-ID')}/org)</div>`;
                    }
                } else if (key === 'Saudara Seibu') {
                    let count = saham[key].count;
                    let totalUang = porsi * nilaiPerSaham;
                    detilUang = `<div>${count} Orang Dibagi Rata (Pria/Wanita): <b>Rp ${totalUang.toLocaleString('id-ID')}</b> (Rp ${(totalUang/count).toLocaleString('id-ID')}/org)</div>`;
                } else {
                    let count = saham[key]?.count || 1;
                    let totalUang = porsi * nilaiPerSaham;
                    detilUang = `<div>${count > 1 ? count + ' Orang' : '1 Orang'}: <b>Rp ${totalUang.toLocaleString('id-ID')}</b> ${count > 1 ? '(Masing-masing: Rp ' + (totalUang/count).toLocaleString('id-ID') + ')' : ''}</div>`;
                }

                hasilHTML += `
                    <div class="bg-white p-3 rounded border border-slate-200">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-emerald-800">${namaDisplay}</span>
                            <span class="text-xs bg-slate-100 px-2 py-1 rounded font-mono">${porsi} / ${asalMasalah} bagian</span>
                        </div>
                        <div class="text-sm text-slate-600">${detilUang}</div>
                    </div>
                `;
            }

            if(Object.keys(furudhData).length === 0) {
                hasilHTML = "<p class='text-red-500 font-bold'>Tidak ada ahli waris yang menerima bagian. Pastikan form diisi.</p>";
            }

            document.getElementById('hasilDiv').innerHTML = hasilHTML;
            document.getElementById('asalMasalahDiv').innerHTML = `Asal Masalah: <b>${asalMasalah}</b> <br> Nilai 1 Saham: <b>Rp ${Math.floor(nilaiPerSaham).toLocaleString('id-ID')}</b>`;
        }
    </script>
</body>
</html>
