<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Waris (Faraid) Mazhab Syafi'i</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-emerald-700 text-white p-6 text-center">
            <h1 class="text-2xl font-bold mb-2">Kalkulator Waris Faraid</h1>
            <p class="text-emerald-100 text-sm">Berdasarkan Mazhab Syafi'i (Mendukung 'Aul, Rad, & Dasar Jadd wa Ikhwah)</p>
        </div>

        <div class="p-6 md:p-8 flex flex-col md:flex-row gap-8">
            <!-- Form Input -->
            <div class="w-full md:w-1/2 space-y-6">
                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4 text-emerald-800">1. Data Pewaris</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">Total Harta Warisan (Rp)</label>
                            <input type="number" id="totalHarta" class="w-full p-2 border border-slate-300 rounded focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Contoh: 100000000" value="100000000">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Jenis Kelamin Almarhum/ah</label>
                            <select id="gender" class="w-full p-2 border border-slate-300 rounded outline-none">
                                <option value="l">Laki-laki (Meninggalkan Istri)</option>
                                <option value="p">Perempuan (Meninggalkan Suami)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4 text-emerald-800">2. Ahli Waris (Masukkan Jumlah)</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Pasangan -->
                        <div>
                            <label id="labelPasangan" class="block text-sm font-semibold mb-1">Istri</label>
                            <input type="number" id="pasangan" min="0" max="4" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div></div> <!-- Spacer -->

                        <!-- Ushul (Ke atas) -->
                        <div>
                            <label class="block text-sm font-semibold mb-1">Ayah</label>
                            <input type="number" id="ayah" min="0" max="1" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Ibu</label>
                            <input type="number" id="ibu" min="0" max="1" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Kakek (Sahih)</label>
                            <input type="number" id="kakek" min="0" max="1" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Nenek (Sahihah)</label>
                            <input type="number" id="nenek" min="0" max="2" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>

                        <!-- Furu' (Ke bawah) -->
                        <div>
                            <label class="block text-sm font-semibold mb-1">Anak Laki-laki</label>
                            <input type="number" id="anakLk" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Anak Perempuan</label>
                            <input type="number" id="anakPr" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>

                        <!-- Hawasyi (Menyamping) -->
                        <div>
                            <label class="block text-sm font-semibold mb-1">Sdr Laki Sekandung</label>
                            <input type="number" id="sdrLk" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Sdr Pr Sekandung</label>
                            <input type="number" id="sdrPr" min="0" value="0" class="w-full p-2 border border-slate-300 rounded outline-none">
                        </div>
                    </div>
                </div>

                <button onclick="hitungFaraid()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    Hitung Warisan
                </button>
            </div>

            <!-- Hasil Output -->
            <div class="w-full md:w-1/2 bg-slate-50 p-6 rounded-xl border border-slate-200 h-fit">
                <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Hasil Perhitungan</h2>
                <div id="statusKondisi" class="text-sm font-medium px-3 py-2 bg-blue-100 text-blue-800 rounded-md mb-4 hidden">
                    <!-- Status Aul/Rad muncul disini -->
                </div>
                <div id="hasilDiv" class="space-y-3">
                    <p class="text-slate-500 italic text-sm">Silakan masukkan data ahli waris dan klik hitung.</p>
                </div>
                
                <div class="mt-8 pt-4 border-t border-slate-200">
                    <h3 class="font-bold text-slate-700 text-sm mb-2">Penyelesaian Matematika (Asal Masalah):</h3>
                    <div id="asalMasalahDiv" class="font-mono text-sm bg-white p-3 border rounded">
                        -
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mengubah label Istri/Suami dinamis berdasarkan jenis kelamin
        document.getElementById('gender').addEventListener('change', function() {
            const label = document.getElementById('labelPasangan');
            const input = document.getElementById('pasangan');
            if (this.value === 'l') {
                label.innerText = 'Istri';
                input.max = 4;
            } else {
                label.innerText = 'Suami';
                input.max = 1;
                if(input.value > 1) input.value = 1;
            }
        });

        // Utilities Matematika Pecahan (KPK dan FPB)
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        function lcm(a, b) { return (a * b) / gcd(a, b); }
        function arrayLcm(arr) {
            if(arr.length === 0) return 1;
            let result = arr[0];
            for (let i = 1; i < arr.length; i++) result = lcm(result, arr[i]);
            return result;
        }

        // Fungsi Utama
        function hitungFaraid() {
            // Ambil Input
            const totalHarta = parseFloat(document.getElementById('totalHarta').value) || 0;
            const gender = document.getElementById('gender').value;
            
            // Ahli Waris Object
            const aw = {
                pasangan: parseInt(document.getElementById('pasangan').value) || 0,
                ayah: parseInt(document.getElementById('ayah').value) || 0,
                ibu: parseInt(document.getElementById('ibu').value) || 0,
                kakek: parseInt(document.getElementById('kakek').value) || 0,
                nenek: parseInt(document.getElementById('nenek').value) || 0,
                anakLk: parseInt(document.getElementById('anakLk').value) || 0,
                anakPr: parseInt(document.getElementById('anakPr').value) || 0,
                sdrLk: parseInt(document.getElementById('sdrLk').value) || 0,
                sdrPr: parseInt(document.getElementById('sdrPr').value) || 0,
            };

            const hasFuru = aw.anakLk > 0 || aw.anakPr > 0;
            const hasSdrBanyak = (aw.sdrLk + aw.sdrPr) > 1;

            let saham = {}; 
            // Format saham: { nama: { n: numerator, d: denominator, isAsabah: boolean, count: jumlah_orang } }

            // 1. SISTEM HUJUB (PENGHALANG)
            if (aw.ayah > 0) aw.kakek = 0; // Ayah menghalangi Kakek
            if (aw.ibu > 0) aw.nenek = 0;  // Ibu menghalangi Nenek
            if (aw.ayah > 0) { aw.sdrLk = 0; aw.sdrPr = 0; } // Ayah menghalangi Saudara
            if (aw.anakLk > 0) { aw.sdrLk = 0; aw.sdrPr = 0; } // Anak Lk menghalangi Saudara

            // 2. TENTUKAN FURUDH (BAGIAN PASTI)
            
            // Suami / Istri
            if (aw.pasangan > 0) {
                if (gender === 'p') { // Suami
                    saham['Suami'] = { n: 1, d: hasFuru ? 4 : 2, isAsabah: false, count: aw.pasangan };
                } else { // Istri
                    saham['Istri'] = { n: 1, d: hasFuru ? 8 : 4, isAsabah: false, count: aw.pasangan };
                }
            }

            // Ibu
            if (aw.ibu > 0) {
                saham['Ibu'] = { n: 1, d: (hasFuru || hasSdrBanyak) ? 6 : 3, isAsabah: false, count: 1 };
                // Catatan: Logika Kasus Gharawain (1/3 Sisa) biasanya disisipkan disini jika hanya ada Suami/Istri + Ayah + Ibu.
            }

            // Nenek
            if (aw.nenek > 0 && aw.ibu === 0) {
                saham['Nenek'] = { n: 1, d: 6, isAsabah: false, count: aw.nenek };
            }

            // Anak Perempuan (Jika tidak ada anak laki-laki)
            if (aw.anakPr > 0 && aw.anakLk === 0) {
                saham['Anak Perempuan'] = { n: aw.anakPr === 1 ? 1 : 2, d: aw.anakPr === 1 ? 2 : 3, isAsabah: false, count: aw.anakPr };
            }

            // JADD WA IKHWAH (Kasus Kakek dan Saudara Kandung)
            // Jika ada Kakek DAN Saudara, menurut Syafi'i kakek bisa milih Muqasamah, 1/3 Harta, atau 1/6 (dicari yang paling menguntungkan kakek).
            // Di skrip ini, disederhanakan: Jika ada furu/ayah, kakek dapat 1/6. Jika tidak, masuk asabah.
            let kakekAsabah = false;
            if (aw.kakek > 0) {
                if (hasFuru) {
                    saham['Kakek'] = { n: 1, d: 6, isAsabah: false, count: 1 };
                } else if (aw.sdrLk > 0 || aw.sdrPr > 0) {
                    // Placeholder Jadd wa Ikhwah (Asumsi sederhana 1/3 untuk purwarupa)
                    saham['Kakek (Jadd wa Ikhwah)'] = { n: 1, d: 3, isAsabah: false, count: 1 };
                } else {
                    kakekAsabah = true;
                }
            }

            // Ayah (Jika ada anak perempuan saja -> 1/6 + Asabah. Jika ada anak laki -> 1/6. Tidak ada anak -> Asabah)
            let ayahAsabah = false;
            if (aw.ayah > 0) {
                if (aw.anakLk > 0) {
                    saham['Ayah'] = { n: 1, d: 6, isAsabah: false, count: 1 };
                } else if (aw.anakPr > 0) {
                    saham['Ayah'] = { n: 1, d: 6, isAsabah: true, count: 1 }; // Dapat 1/6 DAN Asabah
                    ayahAsabah = true;
                } else {
                    ayahAsabah = true;
                }
            }

            // 3. TENTUKAN ASABAH (SISA)
            let asabahPihak = null; // Menentukan siapa yang menarik sisa
            
            if (aw.anakLk > 0) {
                asabahPihak = 'Anak'; 
                saham['Asabah (Anak Lk & Pr)'] = { isAsabah: true, lk: aw.anakLk, pr: aw.anakPr };
            } else if (ayahAsabah) {
                asabahPihak = 'Ayah';
                if(!saham['Ayah']) saham['Ayah (Asabah)'] = { isAsabah: true, count: 1 };
            } else if (kakekAsabah) {
                asabahPihak = 'Kakek';
                saham['Kakek (Asabah)'] = { isAsabah: true, count: 1 };
            } else if (aw.sdrLk > 0 || aw.sdrPr > 0) {
                asabahPihak = 'Saudara';
                saham['Asabah (Saudara Lk & Pr)'] = { isAsabah: true, lk: aw.sdrLk, pr: aw.sdrPr };
            }

            // 4. MENGHITUNG ASAL MASALAH (KPK dari Penyebut)
            let penyebutList = [];
            for (let key in saham) {
                if (saham[key].d) penyebutList.push(saham[key].d);
            }
            let asalMasalah = arrayLcm(penyebutList);
            if (asalMasalah === 1 && asabahPihak) asalMasalah = 1; // Jika hanya asabah

            // Hitung total bagian Furudh
            let totalPembilang = 0;
            let furudhData = {};
            for (let key in saham) {
                if (saham[key].d) {
                    let nilaiPembilang = (asalMasalah / saham[key].d) * saham[key].n;
                    furudhData[key] = nilaiPembilang;
                    totalPembilang += nilaiPembilang;
                }
            }

            let statusText = "Normal";
            let sisaSaham = asalMasalah - totalPembilang;

            // 5. LOGIKA 'AUL & RAD
            if (totalPembilang > asalMasalah) {
                // 'AUL: Pembilang melebih penyebut. Penyebut dinaikkan menjadi total pembilang.
                statusText = `Terdapat 'Aul: Asal Masalah naik dari ${asalMasalah} menjadi ${totalPembilang}`;
                asalMasalah = totalPembilang;
                sisaSaham = 0;
            } else if (totalPembilang < asalMasalah && !asabahPihak) {
                // RAD: Ada sisa tapi tidak ada Asabah.
                // Dalam Syafi'i muta'akhirin, Rad dibagikan ke Ashabul Furudh selain suami/istri.
                let pembilangTanpaPasangan = 0;
                for(let key in furudhData) {
                    if(key !== 'Suami' && key !== 'Istri') pembilangTanpaPasangan += furudhData[key];
                }
                
                if (pembilangTanpaPasangan > 0) {
                    statusText = `Terdapat Rad: Sisa harta dikembalikan ke ahli waris (selain pasangan)`;
                    let pasangansaham = furudhData['Suami'] || furudhData['Istri'] || 0;
                    // Skema Rad Sederhana: Asal masalah baru = Pembilang furudh tanpa pasangan
                    asalMasalah = (asalMasalah - pasangansaham); // Sisa dibagikan proporsional
                } else {
                    // Jika hanya ada suami/istri (Baitul Mal tidak berfungsi) - dikembalikan ke pasangan
                    statusText = `Terdapat Rad: Seluruh sisa diserahkan ke Pasangan (ketiadaan ahli waris lain)`;
                    asalMasalah = totalPembilang;
                }
            }

            // 6. DISTRIBUSI KE ASABAH
            if (asabahPihak && sisaSaham > 0) {
                if (saham['Asabah (Anak Lk & Pr)']) {
                    furudhData['Asabah (Anak Lk & Pr)'] = sisaSaham;
                } else if (saham['Ayah (Asabah)'] || saham['Ayah']) {
                    furudhData['Ayah'] = (furudhData['Ayah'] || 0) + sisaSaham;
                } else if (saham['Kakek (Asabah)']) {
                    furudhData['Kakek (Asabah)'] = sisaSaham;
                } else if (saham['Asabah (Saudara Lk & Pr)']) {
                    furudhData['Asabah (Saudara Lk & Pr)'] = sisaSaham;
                }
            }

            // 7. RENDER HASIL
            let hasilHTML = "";
            let statusEl = document.getElementById('statusKondisi');
            
            if (statusText !== "Normal") {
                statusEl.innerText = statusText;
                statusEl.classList.remove('hidden');
                statusEl.classList.remove('bg-blue-100', 'text-blue-800');
                if(statusText.includes('Aul')) statusEl.classList.add('bg-red-100', 'text-red-800');
                else statusEl.classList.add('bg-amber-100', 'text-amber-800');
            } else {
                statusEl.classList.add('hidden');
            }

            // Hitung Rupiah
            let nilaiPerSaham = totalHarta / asalMasalah;
            
            for (let key in furudhData) {
                let porsi = furudhData[key];
                if (porsi <= 0) continue;

                let namaDisplay = key;
                let detilUang = "";

                if (key === 'Asabah (Anak Lk & Pr)' || key === 'Asabah (Saudara Lk & Pr)') {
                    let d = saham[key];
                    let totalKepala = (d.lk * 2) + d.pr; // Laki-laki 2 bagian, Perempuan 1 bagian (Lidzzakari mislu hadhzil unyatsain)
                    let uangPerKepala = (porsi * nilaiPerSaham) / totalKepala;
                    
                    if (d.lk > 0) detilUang += `<div>Anak/Sdr Lk (${d.lk} org): <b>Rp ${(uangPerKepala * 2 * d.lk).toLocaleString('id-ID')}</b> (Masing-masing: Rp ${(uangPerKepala * 2).toLocaleString('id-ID')})</div>`;
                    if (d.pr > 0) detilUang += `<div>Anak/Sdr Pr (${d.pr} org): <b>Rp ${(uangPerKepala * d.pr).toLocaleString('id-ID')}</b> (Masing-masing: Rp ${uangPerKepala.toLocaleString('id-ID')})</div>`;
                } else {
                    let count = saham[key]?.count || 1;
                    let totalUang = porsi * nilaiPerSaham;
                    detilUang = `<div>${count > 1 ? count + ' Orang' : '1 Orang'}: <b>Rp ${totalUang.toLocaleString('id-ID')}</b> ${count > 1 ? '(Masing-masing: Rp ' + (totalUang/count).toLocaleString('id-ID') + ')' : ''}</div>`;
                }

                hasilHTML += `
                    <div class="bg-white p-3 rounded border border-slate-200">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-emerald-800">${namaDisplay}</span>
                            <span class="text-xs bg-slate-100 px-2 py-1 rounded font-mono">${porsi} / ${asalMasalah} bagian</span>
                        </div>
                        <div class="text-sm text-slate-600">${detilUang}</div>
                    </div>
                `;
            }

            if(Object.keys(furudhData).length === 0) {
                hasilHTML = "<p class='text-red-500 font-bold'>Tidak ada ahli waris yang menerima bagian. Pastikan form diisi.</p>";
            }

            document.getElementById('hasilDiv').innerHTML = hasilHTML;
            document.getElementById('asalMasalahDiv').innerHTML = `Asal Masalah: <b>${asalMasalah}</b> <br> Nilai 1 Saham: <b>Rp ${Math.floor(nilaiPerSaham).toLocaleString('id-ID')}</b>`;
        }
    </script>
</body>
</html>
